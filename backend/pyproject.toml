[project]
name = "astraai"
version = "0.1.0"
description = "AI software development agent orchestrated with LangGraph."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
