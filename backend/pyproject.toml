[project]
name = "astraai"
version = "0.1.0"
description = "AI software development agent orchestrated with LangGraph."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "openai>=3.13.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: calls the real LLM; skipped unless ASTRAAI_LIVE_LLM=1",
    "docker: uses the local Docker daemon; skipped unless ASTRAAI_DOCKER_TESTS=1",
    "e2e: slowed-down lifecycle run over HTTP; skipped unless ASTRAAI_E2E_TESTS=1",
    "github: calls the real GitHub API; skipped unless ASTRAAI_LIVE_GITHUB=1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
